spring.application.name=arenahub-backend
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:itstornei}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.security.jwt.secret-base64=${JWT_SECRET_BASE64:aXRzLXRvcm5laS1jaGlhdmUtc2VncmV0YS1kZXYtMzJieXRl}
app.security.jwt.token-minutes=120
server.error.include-message=always
