services:
  frontend:
    image: nginx:alpine
    container_name: tornei-frontend
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tornei-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/itstornei?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Rome
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-tornei_app}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Definisci MYSQL_PASSWORD nel file .env}
      SERVER_PORT: 8080
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Definisci JWT_SECRET_BASE64 nel file .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: tornei-db
    environment:
      MYSQL_DATABASE: itstornei
      MYSQL_USER: ${MYSQL_USER:-tornei_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definisci MYSQL_PASSWORD nel file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definisci MYSQL_ROOT_PASSWORD nel file .env}
      TZ: Europe/Rome
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      # Nella v2 gli script sono direttamente in ./db (non piu' ./db/init).
      # Il prefisso numerico garantisce l'ordine: prima lo schema, poi i dati.
      - ./db/itstornei.sql:/docker-entrypoint-initdb.d/01-itstornei.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
